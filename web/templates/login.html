<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập · Localize Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/app.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' rx='6' fill='%234f46e5'/><path d='M9 6.5v11a1 1 0 0 0 1.5.87l9-5.5a1 1 0 0 0 0-1.74l-9-5.5A1 1 0 0 0 9 6.5z' fill='white'/></svg>">
  <script>(function(){ try{ document.documentElement.dataset.theme = localStorage.getItem('ls-theme') || 'light'; }catch(e){} })();</script>
</head>
<body>
  <div class="theme-toggle">
    <button type="button" class="t-light" title="Sáng" onclick="lsTheme('light')">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
    <button type="button" class="t-dark" title="Tối" onclick="lsTheme('dark')">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>
    </button>
  </div>

  <div class="login-wrap">
    <form class="login-card" method="post" action="/login">
      <span class="login-logo">
        <svg width="24" height="24" viewBox="0 0 24 24"><path d="M8 5.5v13a1 1 0 0 0 1.5.87l11-6.5a1 1 0 0 0 0-1.74l-11-6.5A1 1 0 0 0 8 5.5z"/></svg>
      </span>
      <h1>Localize<span> Studio</span></h1>
      <div class="sub">Đăng nhập để tiếp tục</div>
      <input type="hidden" name="next" value="{{ next }}">
      {% if error %}<div class="alert alert-error">Sai mật khẩu, thử lại.</div>{% endif %}
      <label>Mật khẩu</label>
      <input type="password" name="password" placeholder="••••••••" autofocus required>
      <button type="submit" class="btn btn-primary">Đăng nhập</button>
    </form>
  </div>

  <script src="/static/app.js" defer></script>
</body>
</html>
