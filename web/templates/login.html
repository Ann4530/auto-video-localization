<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập · Localize Studio</title>
  <link rel="stylesheet" href="/static/app.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
</head>
<body>
  <div class="login-wrap">
    <form class="login-card" method="post" action="/login">
      <div class="login-logo">🎬</div>
      <h1>Localize<b>Studio</b></h1>
      <p class="muted">Đăng nhập để tiếp tục</p>
      <input type="hidden" name="next" value="{{ next }}">
      {% if error %}<div class="alert alert-error">Sai mật khẩu, thử lại.</div>{% endif %}
      <input type="password" name="password" placeholder="Mật khẩu" autofocus required>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center">Đăng nhập</button>
    </form>
  </div>
</body>
</html>
